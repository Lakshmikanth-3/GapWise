name: ZeroGap engine
# Runs a real engine cycle (reserves, safety events, full liability scan, flow match, alerts) every ~5 minutes and
# publishes the state to the `zerogap-data` branch, which the Vercel site serves. GitHub's cron fires only every few
# hours, so one run loops for ~5.5 h (scripts/engine-loop.sh) and then starts the next run itself. The cron stays as a
# fallback in case the chain ever breaks.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: zerogap-engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Engine loop (mainnet + labelled testnet, publish every cycle)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ASTER_API_KEY: ${{ secrets.ASTER_API_KEY }}
          ASTER_API_SECRET: ${{ secrets.ASTER_API_SECRET }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_URL: https://zerogap-strike.vercel.app
        run: bash scripts/engine-loop.sh

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref main
